<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Game Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>Free Game Hub</h1>
      <p class="subtitle">Play online or download your favorite games</p>

      <div class="search-box">
        <input id="searchInput" type="text" placeholder="Search games..." />
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="action">Action</button>
        <button class="filter-btn" data-filter="racing">Racing</button>
        <button class="filter-btn" data-filter="puzzle">Puzzle</button>
        <button class="filter-btn" data-filter="sports">Sports</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="gameList" class="game-grid"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
