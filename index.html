<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Game Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }
    .topbar {
      background: linear-gradient(135deg, #111827, #1e293b);
      padding: 30px 0 20px;
      border-bottom: 2px solid #334155;
    }
    h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    .topbar p {
      margin-top: 10px;
      color: #cbd5e1;
    }
    .search-box {
      margin-top: 20px;
    }
    .search-box input {
      width: 100%;
      max-width: 500px;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 1rem;
    }
    .filters {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .filter-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #334155;
      color: white;
      font-weight: bold;
    }
    .filter-btn.active {
      background: #22c55e;
      color: #04130a;
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
      padding: 30px 0;
    }
    .game-card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    .game-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .game-content {
      padding: 16px;
    }
    .game-content h2 {
      margin: 0;
      font-size: 1.4rem;
    }
    .game-content p {
      color: #cbd5e1;
      margin: 12px 0 16px;
      line-height: 1.5;
    }
    .game-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .game-tags span {
      background: #1e293b;
      color: #93c5fd;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
    }
    .game-actions {
      display: flex;
      gap: 10px;
    }
    .game-actions a {
      flex: 1;
      text-align: center;
      text-decoration: none;
      color: white;
      padding: 12px 10px;
      border-radius: 10px;
      font-weight: bold;
    }
    .play-btn { background: #2563eb; }
    .download-btn { background: #16a34a; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>Free Game Hub</h1>
      <p>Play free games online or download them</p>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search game..." />
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="action">Action</button>
        <button class="filter-btn" data-filter="racing">Racing</button>
        <button class="filter-btn" data-filter="puzzle">Puzzle</button>
        <button class="filter-btn" data-filter="sports">Sports</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="gameList" class="game-grid"></section>
  </main>

  <script>
    const games = [
      {
        title: "Pixel Dash",
        category: "action",
        tags: ["Arcade", "Fast"],
        description: "A fun endless runner with colorful levels and quick reflex challenges.",
        image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80",
        playUrl: "https://example.com/play/pixel-dash",
        downloadUrl: "https://example.com/downloads/pixel-dash.zip"
      },
      {
        title: "Car Drift 3D",
        category: "racing",
        tags: ["Racing", "3D"],
        description: "Race through tight roads and drift around corners in this exciting challenge.",
        image: "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=800&q=80",
        playUrl: "https://example.com/play/car-drift-3d",
        downloadUrl: "https://example.com/downloads/car-drift-3d.zip"
      },
      {
        title: "Block Puzzle",
        category: "puzzle",
        tags: ["Brain", "Logic"],
        description: "Arrange colorful blocks and build lines to clear the board.",
        image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80",
        playUrl: "https://example.com/play/block-puzzle",
        downloadUrl: "https://example.com/downloads/block-puzzle.zip"
      },
      {
        title: "Football Rush",
        category: "sports",
        tags: ["Sports", "Arcade"],
        description: "Play fast football matches and score amazing goals.",
        image: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=800&q=80",
        playUrl: "https://example.com/play/football-rush",
        downloadUrl: "https://example.com/downloads/football-rush.zip"
      }
    ];

    const gameList = document.getElementById("gameList");
    const searchInput = document.getElementById("searchInput");
    const filterButtons = document.querySelectorAll(".filter-btn");

    let activeFilter = "all";
    let searchTerm = "";

    function renderGames() {
      const filteredGames = games.filter((game) => {
        const matchesFilter = activeFilter === "all" || game.category === activeFilter;
        const matchesSearch =
          game.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
          game.description.toLowerCase().includes(searchTerm.toLowerCase());

        return matchesFilter && matchesSearch;
      });

      gameList.innerHTML = "";

      filteredGames.forEach((game) => {
        const card = document.createElement("article");
        card.className = "game-card";

        card.innerHTML = `
          <img src="${game.image}" alt="${game.title}" />
          <div class="game-content">
            <h2>${game.title}</h2>
            <div class="game-tags">
              ${game.tags.map(tag => `<span>${tag}</span>`).join("")}
            </div>
            <p>${game.description}</p>
            <div class="game-actions">
              <a href="${game.playUrl}" target="_blank" class="play-btn">Play Now</a>
              <a href="${game.downloadUrl}" target="_blank" class="download-btn">Download</a>
            </div>
          </div>
        `;

        gameList.appendChild(card);
      });
    }

    searchInput.addEventListener("input", (e) => {
      searchTerm = e.target.value.trim();
      renderGames();
    });

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        filterButtons.forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
        activeFilter = button.dataset.filter;
        renderGames();
      });
    });

    renderGames();
  </script>
</body>
</html>
